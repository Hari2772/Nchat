version: '3.8'

services:
  # NearChat Backend Application
  nearchat-backend:
    build: .
    container_name: nearchat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/nearchat
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      - mongo
      - redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - nearchat-network
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: nearchat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=nearchat
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - nearchat-network
    command: mongod --auth --bind_ip_all

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: nearchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nearchat-network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # Redis Sentinel for High Availability
  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: nearchat-redis-sentinel-1
    restart: unless-stopped
    ports:
      - "26379:26379"
    volumes:
      - ./redis-sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    networks:
      - nearchat-network
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nearchat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - nearchat-backend
    networks:
      - nearchat-network

  # PM2 Process Manager
  pm2:
    image: keymetrics/pm2:18-alpine
    container_name: nearchat-pm2
    restart: unless-stopped
    ports:
      - "9615:9615"
    volumes:
      - ./ecosystem.config.js:/app/ecosystem.config.js:ro
      - ./logs:/app/logs
    environment:
      - PM2_PUBLIC_KEY=${PM2_PUBLIC_KEY}
      - PM2_SECRET_KEY=${PM2_SECRET_KEY}
    networks:
      - nearchat-network
    depends_on:
      - nearchat-backend

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  nearchat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16