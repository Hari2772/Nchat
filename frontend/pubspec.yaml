name: nearchat_app
description: NearChat - Enterprise-grade social messaging platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Network & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Real-time Communication
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^0.9.47

  # Authentication
  google_sign_in: ^6.1.6
  firebase_auth: ^4.15.3
  firebase_core: ^2.24.2

  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.1.0

  # UI Components
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  video_player: ^2.8.1
  camera: ^0.10.5+5
  photo_view: ^0.14.0
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.1

  # Animations & Effects
  lottie: ^2.7.0
  shimmer: ^3.0.0
  confetti: ^0.7.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1
  crypto: ^3.0.3
  connectivity_plus: ^5.0.2
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0

  # Background Tasks
  workmanager: ^0.5.2
  background_fetch: ^1.3.2

  # Notifications
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0

  # Monetization
  google_mobile_ads: ^4.0.0

  # Analytics
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  firebase_performance: ^0.9.3+8

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator_platform_interface: ^4.0.0

  # Media & Files
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  url_launcher: ^6.2.2

  # UI Enhancement
  flutter_svg: ^2.0.9
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0

  # Security
  flutter_screen_lock: ^9.0.2
  local_auth: ^2.1.7

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Charts & Analytics
  fl_chart: ^0.65.0

  # Social Features
  share_plus: ^7.2.1
  url_launcher: ^6.2.2

  # Development & Debugging
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  retrofit_generator: ^7.0.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting & Formatting
  flutter_lints: ^3.0.1
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # Platform-specific configurations
  android:
    package: com.nearchat.app
    minSdkVersion: 21
    targetSdkVersion: 34
    compileSdkVersion: 34

  ios:
    bundleIdentifier: com.nearchat.app
    minimumOsVersion: '12.0'

# Flutter Launcher Icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

# Flutter Native Splash
flutter_native_splash:
  color: "#007AFF"
  image: assets/images/splash_logo.png
  branding: assets/images/branding.png
  color_dark: "#000000"
  image_dark: assets/images/splash_logo_dark.png
  branding_dark: assets/images/branding_dark.png

  android_12:
    image: assets/images/splash_logo.png
    icon_background_color: "#007AFF"
    image_dark: assets/images/splash_logo_dark.png
    icon_background_color_dark: "#000000"

  web: false